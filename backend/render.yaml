services:
  - type: web
    name: adoptly-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT -w 1 --threads 4 app:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: adoptly-1
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OAUTH_CLIENT_ID
        sync: false
      - key: OAUTH_CLIENT_SECRET
        sync: false
      - key: OAUTH_REFRESH_TOKEN
        sync: false
